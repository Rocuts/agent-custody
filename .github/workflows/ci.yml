name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # Actions are pinned to full commit SHAs (tags are mutable); the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests without pytest (standard library only)
        run: python -m unittest discover -s tests -v
      - name: Tests with pytest (pinned, hash-checked dependencies)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-dev.txt
          python -m pytest -q
      - name: Verifier smoke test, isolated mode, no third-party packages on the path
        run: |
          python -I verifier/agent_custody_verify.py examples/02-security-scan-approved/log.jsonl \
            --checkpoint examples/02-security-scan-approved/checkpoint.note \
            --vkey "$(cat examples/02-security-scan-approved/vkey.txt)" \
            --approver-key "$(cat examples/02-security-scan-approved/approver-key.txt)" \
            --require checkpoint_signature,approver_signatures
      - name: Tampered log must fail
        run: |
          sed 's/lab-host-a/lab-host-z/' examples/02-security-scan-approved/log.jsonl > "$RUNNER_TEMP/tampered.jsonl"
          if python -I verifier/agent_custody_verify.py "$RUNNER_TEMP/tampered.jsonl"; then echo "tampered log verified" && exit 1; fi
      - name: Generated files are up to date and nothing untracked was produced
        run: |
          python tools/make_vectors.py && python tools/make_examples.py
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
